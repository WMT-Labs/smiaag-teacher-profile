<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data rujukan — Profil Guru SMIAAG</title>
  <link rel="icon" type="image/png" href="assets/favicon-64.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var sesi = App.guard({ roles: ['superadmin'] });
      if (!sesi) return;
      var el = UI.el;
      var c = App.mount({ sesi: sesi, active: 'rujukan', title: 'Data rujukan' });
      var D = null;
      var tbody = el('tbody');
      var add = el('button', { class: 'btn btn-sm', type: 'button' }, [App.icon('i-plus', 16), 'Tambah subjek']);
      add.addEventListener('click', function () { borang(null); });
      c.appendChild(el('section', { class: 'card' }, [
        el('div', { class: 'card-head' }, [el('div', {}, [el('h2', {}, 'Subjek'), el('p', { class: 'muted', style: 'font-size:.8125rem;margin-top:2px' }, 'Digunakan untuk opsyen guru dan (Fasa 3) tugasan serta jadual.')]), add]),
        el('div', { class: 'table-wrap' }, el('table', { class: 'data cards' }, [
          el('thead', {}, el('tr', {}, [el('th', {}, 'Nama'), el('th', {}, 'Kod'), el('th', {}, 'Kategori'), el('th', { class: 'r' }, '')])),
          tbody
        ]))
      ]));

      function render() {
        tbody.textContent = '';
        if (!D.subjek.length) { tbody.appendChild(el('tr', {}, el('td', { colspan: '4', class: 'empty full' }, 'Belum ada subjek. Tekan "Tambah subjek".'))); return; }
        D.subjek.forEach(function (s) {
          var b = el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Sunting ' + s.nama }, App.icon('i-edit'));
          b.addEventListener('click', function () { borang(s); });
          tbody.appendChild(el('tr', {}, [
            el('td', { 'data-label': 'Nama' }, el('b', {}, s.nama)),
            el('td', { 'data-label': 'Kod' }, s.kod || '—'),
            el('td', { 'data-label': 'Kategori' }, App.labelOf(D.kategori, s.kategori)),
            el('td', { 'data-label': '', class: 'r' }, b)
          ]));
        });
      }
      function borang(s) {
        s = s || {};
        App.formDialog({
          title: s.id ? 'Sunting subjek' : 'Tambah subjek',
          fields: [
            { name: 'nama', label: 'Nama subjek', required: true, value: s.nama, placeholder: 'contoh: Pendidikan Islam', attrs: { maxlength: '120' } },
            { name: 'kod', label: 'Kod', value: s.kod, placeholder: 'contoh: PI', attrs: { maxlength: '20' } },
            { name: 'kategori', label: 'Kategori', type: 'select', required: true, options: D.kategori, value: s.kategori || 'subjek' }
          ],
          onSubmit: function (v) { if (s.id) v.id = s.id; return Api.call('SUBJEK_SIMPAN', v); }
        }).then(function (r) { if (r) { UI.toast('Subjek disimpan.'); muat(); } });
      }
      function muat() { return Api.call('SUBJEK_SENARAI').then(function (d) { D = d; render(); }, function (e) { UI.toast(e.message); }); }
      muat();
    })();
  </script>
</body>
</html>
