<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laman utama — Profil Guru SMIAAG</title>
  <link rel="icon" type="image/png" href="assets/favicon-64.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var sesi = App.guard();
      if (!sesi) return;
      var el = UI.el;
      var c = App.mount({ sesi: sesi, active: 'utama', title: 'Laman utama' });
      var admin = sesi.role !== 'guru';

      c.appendChild(el('section', { class: 'welcome' }, [
        el('h2', { style: 'font-size:1.375rem' }, 'Assalamualaikum, ' + sesi.nama_penuh),
        el('p', { class: 'muted' }, sesi.guru_kod + ' · ' + App.LABEL_ROLE[sesi.role])
      ]));

      function card(o) {
        var inner = [el('span', { class: 'ico' }, App.icon(o.icon)), el('div', {}, [el('b', {}, o.title), el('span', {}, o.desc)])];
        return o.href ? el('a', { class: 'card link-card', href: o.href }, inner) : el('div', { class: 'card link-card soon' }, inner);
      }
      var links = el('section', { class: 'links', 'aria-label': 'Pautan pantas' });
      if (!sesi.akaun_sistem) {
        links.appendChild(card({ icon: 'i-users', title: 'Profil saya', href: 'profil.html', desc: 'Maklumat teras, kelayakan, opsyen, kursus dan cerapan.' }));
        links.appendChild(card({ icon: 'i-book', title: 'Kurikulum', href: 'kurikulum.html', desc: 'Tugasan, jam kredit dan jadual waktu anda.' }));
        links.appendChild(card({ icon: 'i-trophy', title: 'Kokurikulum', href: 'koku.html', desc: 'Unit beruniform, kelab, rumah sukan dan pertandingan.' }));
        links.appendChild(card({ icon: 'i-heart', title: 'HEM', href: 'hem.html', desc: 'Usrah pelajar, usrah guru dan kehadiran, Guru Tarbiah, Guru Kelas.' }));
      }
      if (admin) links.appendChild(card({ icon: 'i-clipboard', title: 'Senarai guru', href: 'guru.html', desc: 'Profil, jam kredit, percubaan dan cerapan setiap guru.' }));
      if (admin) links.appendChild(card({ icon: 'i-search', title: 'Guru ganti (relief)', href: 'guru-ganti.html', desc: 'Guru tidak hadir, pilih pengganti, salin hebahan WhatsApp.' }));
      if (admin) links.appendChild(card({ icon: 'i-trophy', title: 'Urus kokurikulum', href: 'koku-urus.html', desc: 'Kelab, unit, rumah sukan, juara dan pertandingan.' }));
      if (admin) links.appendChild(card({ icon: 'i-heart', title: 'Urus HEM', href: 'hem-urus.html', desc: 'Kumpulan usrah guru, murabbi, ahli dan kehadiran.' }));
      if (admin) links.appendChild(card({ icon: 'i-shield', title: 'Urus akaun', href: 'akaun.html', desc: sesi.role === 'superadmin' ? 'Cipta akaun, reset kata laluan, nyahaktif.' : 'Lihat akaun dan buka kunci akaun guru.' }));
      if (admin) links.insertBefore(card({ icon: 'i-dashboard', title: 'Dashboard sekolah', href: 'dashboard.html', desc: 'Beban kerja, cerapan, kokurikulum dan HEM seluruh sekolah. Eksport CSV.' }), links.firstChild);
      if (sesi.role === 'superadmin') links.appendChild(card({ icon: 'i-sliders', title: 'Data rujukan', href: 'rujukan.html', desc: 'Subjek, kelas, waktu persekolahan dan had jam kredit.' }));
      c.appendChild(links);

      // Perlu tindakan (pentadbir): guru yang tamat tempoh percubaan 6 bulan
      if (admin) {
        Api.call('GURU_SENARAI').then(function (d) {
          var tamat = d.guru.filter(function (g) { return g.aktif && g.percubaan && g.percubaan.tamat; });
          var lebih = d.guru.filter(function (g) { return g.aktif && g.status_beban === 'lebih'; });
          var prak = d.guru.filter(function (g) { return g.aktif && g.praktikal && (g.praktikal.tamat || g.praktikal.hampir); });
          var items = [];
          if (tamat.length) items.push(el('div', { class: 'notice notice-warn', style: 'align-items:center;flex-wrap:wrap' }, [
            el('span', { style: 'flex:1' }, tamat.length + ' guru sudah tamat tempoh percubaan 6 bulan dan menunggu pengesahan ke guru tetap: ' + tamat.map(function (g) { return g.nama_penuh; }).join(', ') + '.'),
            el('a', { class: 'btn btn-sm', href: 'guru.html?tapis=percubaan' }, 'Lihat dan sahkan')
          ]));
          if (prak.length) items.push(el('div', { class: 'notice notice-warn' }, el('span', {}, 'Guru praktikal yang tamat atau hampir tamat (30 hari): ' + prak.map(function (g) { return g.nama_penuh + ' (' + UI.fmtDate(g.praktikal.tarikh_tamat) + ')'; }).join(', ') + '.')));
          if (lebih.length) items.push(el('div', { class: 'notice notice-error' }, el('span', {}, lebih.length + ' guru melebihi had jam kredit tahun ini.')));
          if (items.length) c.insertBefore(el('section', { class: 'stack', 'aria-label': 'Perlu tindakan' }, [el('h2', {}, 'Perlu tindakan')].concat(items)), links);
        }).catch(function () {});
      }

    })();
  </script>
</body>
</html>
