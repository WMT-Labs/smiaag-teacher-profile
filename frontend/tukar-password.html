<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tukar kata laluan — Profil Guru SMIAAG</title>
  <link rel="icon" type="image/png" href="assets/favicon-64.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#00548d">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Profil Guru">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <template id="form-tpl">
    <section class="card" style="max-width:520px;width:100%">
      <div class="card-head"><h2 data-title>Tukar kata laluan</h2></div>
      <form class="card-pad stack" novalidate>
        <p class="muted" data-intro></p>
        <div class="notice notice-error" role="alert" hidden data-alert><span data-alert-text></span></div>
        <div class="field">
          <label for="lama" data-lama-label>Kata laluan semasa</label>
          <input class="input" id="lama" type="password" autocomplete="current-password" maxlength="100" required>
        </div>
        <div class="field">
          <label for="baru">Kata laluan baharu</label>
          <input class="input" id="baru" type="password" autocomplete="new-password" maxlength="100" required aria-describedby="rules">
          <ul class="rules" id="rules">
            <li data-r="len">Sekurang-kurangnya 8 aksara</li>
            <li data-r="id">Tidak sama dengan ID guru</li>
            <li data-r="beza">Berbeza daripada kata laluan semasa</li>
          </ul>
        </div>
        <div class="field">
          <label for="ulang">Taip semula kata laluan baharu</label>
          <input class="input" id="ulang" type="password" autocomplete="new-password" maxlength="100" required>
        </div>
        <div class="row end">
          <button class="btn-link" type="button" data-batal>Log keluar</button>
          <button class="btn" type="submit" data-submit>Simpan kata laluan</button>
        </div>
      </form>
    </section>
  </template>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var sesi = App.guard({ pendingPage: true });
      if (!sesi) return;
      if (sesi.perlu_persetujuan_pdpa) { location.replace('privasi.html'); return; }
      var wajib = sesi.wajib_tukar_password;
      var card = document.getElementById('form-tpl').content.cloneNode(true).firstElementChild;

      if (wajib) {
        // Langkah wajib: halaman ringkas tanpa menu
        var wrap = UI.el('main', { class: 'page-narrow' }, UI.el('div', { style: 'width:100%;max-width:520px' }, [
          UI.el('div', { class: 'page-head' }, [
            UI.el('img', { src: 'assets/logo-96.png', alt: 'Logo SMIAAG', width: '48', height: '48' }),
            UI.el('div', {}, [UI.el('b', {}, 'Profil Guru SMIAAG'), UI.el('span', {}, 'Langkah 2 daripada 2: kata laluan baharu')])
          ]),
          card
        ]));
        document.body.appendChild(wrap);
        card.querySelector('[data-title]').textContent = 'Tetapkan kata laluan baharu';
        card.querySelector('[data-intro]').textContent = 'Anda sedang menggunakan kata laluan sementara. Tetapkan kata laluan sendiri yang hanya anda tahu.';
        card.querySelector('[data-lama-label]').textContent = 'Kata laluan sementara';
        card.querySelector('[data-batal]').addEventListener('click', App.logout);
      } else {
        App.mount({ sesi: sesi, active: 'password', title: 'Tukar kata laluan' }).appendChild(card);
        card.querySelector('[data-intro]').textContent = 'Selepas ditukar, peranti lain yang sedang log masuk dengan akaun anda akan dilog keluar.';
        var batal = card.querySelector('[data-batal]');
        batal.textContent = 'Batal';
        batal.addEventListener('click', function () { location.href = 'utama.html'; });
      }

      var form = card.querySelector('form');
      var lama = card.querySelector('#lama'), baru = card.querySelector('#baru'), ulang = card.querySelector('#ulang');
      var alertBox = card.querySelector('[data-alert]'), alertText = card.querySelector('[data-alert-text]');
      var btn = card.querySelector('[data-submit]');

      function rules() {
        var v = baru.value;
        var r = { len: v.length >= 8, id: v.length > 0 && v.trim().toUpperCase() !== sesi.guru_kod, beza: v.length > 0 && v !== lama.value };
        Object.keys(r).forEach(function (k) { card.querySelector('[data-r="' + k + '"]').classList.toggle('ok', r[k]); });
        return r.len && r.id && r.beza;
      }
      baru.addEventListener('input', rules);
      lama.addEventListener('input', rules);

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        alertBox.hidden = true;
        function err(m, f) { alertText.textContent = m; alertBox.hidden = false; if (f) f.focus(); }
        if (!lama.value) return err('Masukkan kata laluan ' + (wajib ? 'sementara.' : 'semasa.'), lama);
        if (!rules()) return err('Kata laluan baharu belum memenuhi semua syarat di bawahnya.', baru);
        if (baru.value !== ulang.value) return err('Kata laluan yang ditaip semula tidak sama.', ulang);
        btn.disabled = true; btn.textContent = 'Menyimpan...';
        Api.call('TUKAR_PASSWORD', { password_lama: lama.value, password_baru: baru.value }).then(function (s) {
          App.updateSesi(s);
          if (wajib) { location.replace(App.nextPage(s)); return; }
          form.reset(); rules();
          UI.toast('Kata laluan telah ditukar.');
          btn.disabled = false; btn.textContent = 'Simpan kata laluan';
        }).catch(function (e2) {
          err(e2.message, e2.code === 'PASSWORD_LAMA_SALAH' ? lama : null);
          btn.disabled = false; btn.textContent = 'Simpan kata laluan';
        });
      });
    })();
  </script>
</body>
</html>
